name: Monitor rebase
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [discover, resume, regenerate, reconcile]
        default: discover
        required: true
      tag:
        type: string
        default: ''
      expected_head:
        description: 'Required for regenerate/reconcile; reconcile copies pushed-head from publication-hold.json'
        type: string
        default: ''
      candidate_ref:
        description: 'Lease proof ref only; leave empty for normal regeneration'
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: monitor-rebase
  cancel-in-progress: false
jobs:
  transition:
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        mode: ${{ fromJSON(github.event_name == 'schedule' && '["discover","resume"]' || format('["{0}"]', inputs.mode)) }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-apple-darwin
      - name: Verify hosted tools
        run: |
          python3 --version
          gh --version
          git --version
          just --version
          cargo nextest --version
      - name: Configure upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/openai/codex.git
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Transition
        env:
          MONITOR_REBASE_RESULTS: ${{ runner.temp }}/monitor-rebase/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.mode }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ matrix.mode }}
          TAG: ${{ inputs.tag }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        shell: bash
        run: |
          args=(transition "$MODE" --tag "$TAG")
          if [[ "$MODE" == regenerate || "$MODE" == reconcile ]]; then
            [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_head is required for regenerate/reconcile' >&2; exit 1; }
            args+=(--expected-head "$EXPECTED_HEAD")
          fi
          if [[ -n "$CANDIDATE_REF" ]]; then args+=(--candidate-ref "$CANDIDATE_REF"); fi
          bash scripts/rebase-monitor.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-rebase-receipts-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/monitor-rebase/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.mode }}/
          if-no-files-found: ignore
